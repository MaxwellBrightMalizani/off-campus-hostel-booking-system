{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">

      <div class="card shadow border-0 rounded-4">
        <div class="card-body p-4">

          <div class="text-center mb-4">
            <i class="fas fa-sign-in-alt fa-2x text-success"></i>
            <h3 class="fw-bold mt-2">Welcome Back</h3>
            <p class="text-muted small">Sign in to your HostelHub account</p>
          </div>

          <form method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-grid mt-3">
              <button type="submit" class="btn btn-success btn-lg">
                <i class="fas fa-sign-in-alt me-1"></i> Login
              </button>
            </div>
          </form>

          <p class="text-center mt-3 mb-0 small">
            Don't have an account?
            <a href="{% url 'accounts:register' %}" class="text-success fw-semibold">Register here</a>
          </p>

        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
