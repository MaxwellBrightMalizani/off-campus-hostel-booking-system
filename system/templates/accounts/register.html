{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card auth-card shadow border-0 rounded-4">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <i class="fas fa-user-plus fa-2x text-success"></i>
            <h3 class="fw-bold mt-2">Create an Account</h3>
            <p class="text-muted small">Join HostelHub as a student or hostel owner</p>
          </div>

          <form method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-grid mt-3">
              <button type="submit" class="btn btn-success btn-lg">
                <i class="fas fa-user-check me-1"></i>Register
              </button>
            </div>
          </form>

          <p class="text-center mt-3 mb-0 small">
            Already have an account?
            <a href="{% url 'accounts:login' %}" class="text-success fw-semibold">Login here</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
