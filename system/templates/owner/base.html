{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Owner{% endblock %} | HostelHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
<script>
    // Sync owner pages with the main app dark-mode toggle.
    // Stored in localStorage by main.js; if not present, default stays light.
    (function(){
      function initThemeToggle(){
        try{
          const savedTheme = localStorage.getItem('theme');
          const darkMode = savedTheme === 'dark';
          document.body.classList.toggle('dark-mode', darkMode);

          const themeToggle = document.getElementById('darkModeToggle');
          if(themeToggle){
            themeToggle.addEventListener('click', function(){
              const isDark = document.body.classList.toggle('dark-mode');
              localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });
          }
        }catch(e){}
      }

      if(document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', initThemeToggle);
      } else {
        initThemeToggle();
      }
    })();
  </script>



</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom app-navbar shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-success" href="{% url 'listings:owner_dashboard' %}">HostelHub (Owner)</a>
    <div class="d-flex gap-2 align-items-center">
      <a class="btn btn-outline-success btn-sm" href="{% url 'listings:owner_property_list' %}">Hostels</a>

      <button id="darkModeToggle" class="theme-switch" type="button" aria-label="Toggle dark theme" aria-pressed="false">

        <span class="theme-switch-track">
          <span class="theme-switch-icon theme-switch-moon"><i class="fas fa-moon"></i></span>
          <span class="theme-switch-icon theme-switch-sun"><i class="fas fa-sun"></i></span>
          <span class="theme-switch-thumb"></span>
        </span>
      </button>

      <a class="btn btn-outline-secondary btn-sm" href="{% url 'accounts:logout' %}">Logout</a>
    </div>
  </div>
</nav>


{% if messages %}
<div class="container mt-3" id="flash-messages">
  {% for m in messages %}
    <div class="alert alert-{{ m.tags|default:'info' }} alert-dismissible fade show py-2">
      {{ m }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  {% endfor %}
</div>
{% endif %}

<main>
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
