{% extends 'owner/base.html' %}

{% block title %}Hostel Details{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="card">
    <div class="card-header">
      <h3 class="mb-0">{% if mode == 'edit' %}Edit Hostel{% else %}Add Hostel{% endif %}</h3>
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex gap-2 mt-3">
          <button type="submit" class="btn btn-success">Save</button>
          <a class="btn btn-outline-secondary" href="{% url 'listings:owner_property_list' %}">Back</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
